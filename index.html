<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot Mystère : Le Monde des Animaux</title>
    
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'title': ['"Fredoka One"', 'cursive'],
                        'body': ['Inter', 'sans-serif'],
                        'handwriting': ['Quicksand', 'sans-serif'],
                        'mono': ['Courier New', 'monospace']
                    },
                    colors: {
                        brand: {
                            light: '#f0fdf4', // vert pastel
                            DEFAULT: '#22c55e', // vert animal
                            dark: '#166534',
                        },
                        pastel: {
                            blue: '#bfdbfe',
                            pink: '#fbcfe8',
                            yellow: '#fef08a',
                            purple: '#e9d5ff',
                            orange: '#fed7aa'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & Babel & html2canvas -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #f3f4f6;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* Dimension absolue pour garantir le format papier (Proche Letter US / A4) */
        .page-container {
            width: 816px; 
            height: 1056px;
            background-color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Responsive wrapper pour l'écran */
        .responsive-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
        }

        /* Empêcher la sélection de texte native dans la grille pour l'interactivité */
        .grid-container {
            user-select: none;
            touch-action: none; /* Crucial pour le mobile */
        }

        /* Animations simples */
        .word-strike {
            text-decoration: line-through;
            color: #9ca3af;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- DONNÉES PÉDAGOGIQUES ---
        const VOCABULARY = [
            "ACCORD", "DEBUT", "DESERT", "DIFFERENT", "FORT", 
            "FROID", "GOUT", "GRAND", "PLAT", "PRET", 
            "PROFOND", "SOLDAT", "SUIVANT", "TOUT", "VIVANT", 
            "LION", "DAUPHIN", "GIRAFE", "LIEVRE", "SERPENT"
        ].sort(); // Tri alphabétique pour la liste

        const SECRET_MESSAGE = "LES ANIMAUX SONT MERVEILLEUX";
        const SECRET_MESSAGE_CLEAN = SECRET_MESSAGE.replace(/\s/g, ''); // 25 lettres
        const PADDING_TEXT = "PROTEGEONSLAFORETETLOUSCEANCARCHAQUEVIESAUVAGEESTPRECIEUSEPOURNORTEBELLEPLANETENATURELLEETMAGIQUE";
        
        const GRID_SIZE = 14;

        // --- GÉNÉRATEUR DE GRILLE (ALGORITHME) ---
        function generatePuzzle() {
            let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            let placedWords = [];
            let cellWordMap = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill([]));

            const directions = [
                [0, 1], [1, 0], [1, 1], [-1, 1], // Horiz, Vert, Diag Desc, Diag Asc
                [0, -1], [-1, 0], [-1, -1], [1, -1] // Mêmes directions inversées
            ];

            // Trier les mots du plus long au plus court facilite le placement
            const wordsToPlace = [...VOCABULARY].sort((a, b) => b.length - a.length);

            wordsToPlace.forEach(word => {
                let placed = false;
                let attempts = 0;
                
                while (!placed && attempts < 500) {
                    attempts++;
                    const dir = directions[Math.floor(Math.random() * directions.length)];
                    const row = Math.floor(Math.random() * GRID_SIZE);
                    const col = Math.floor(Math.random() * GRID_SIZE);

                    const endRow = row + dir[0] * (word.length - 1);
                    const endCol = col + dir[1] * (word.length - 1);

                    // Vérifier si le mot rentre dans la grille
                    if (endRow >= 0 && endRow < GRID_SIZE && endCol >= 0 && endCol < GRID_SIZE) {
                        let canPlace = true;
                        for (let i = 0; i < word.length; i++) {
                            const r = row + dir[0] * i;
                            const c = col + dir[1] * i;
                            if (grid[r][c] !== null && grid[r][c] !== word[i]) {
                                canPlace = false;
                                break;
                            }
                        }

                        if (canPlace) {
                            let wordCells = [];
                            for (let i = 0; i < word.length; i++) {
                                const r = row + dir[0] * i;
                                const c = col + dir[1] * i;
                                grid[r][c] = word[i];
                                wordCells.push(`${r},${c}`);
                            }
                            placedWords.push({ word, cells: wordCells });
                            placed = true;
                        }
                    }
                }
                if (!placed) console.warn(`Impossible de placer le mot : ${word}`);
            });

            // Remplir les cases vides avec le message secret puis le texte de remplissage
            let messagePool = SECRET_MESSAGE_CLEAN + PADDING_TEXT;
            let poolIndex = 0;
            let secretMessageCells = []; // Garder une trace des cases du vrai message secret

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === null) {
                        grid[r][c] = messagePool[poolIndex % messagePool.length];
                        if (poolIndex < SECRET_MESSAGE_CLEAN.length) {
                            secretMessageCells.push(`${r},${c}`);
                        }
                        poolIndex++;
                    }
                }
            }

            return { grid, placedWords, secretMessageCells };
        }

        // --- COMPOSANT ICÔNES (SVG Inlinés) ---
        const IconPaw = () => (
            <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6 text-brand-dark">
                <path d="M8.25 7.5a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0ZM12.75 4.5a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0ZM20.25 7.5a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0ZM16.327 12.873c-1.391-.497-2.736-1.077-4.327-1.077s-2.936.58-4.327 1.077c-2.477.884-4.536 2.825-4.536 5.377 0 1.93 1.57 3.5 3.5 3.5.756 0 1.488-.236 2.1-.652a2.633 2.633 0 0 1 3.264 0c.612.416 1.344.652 2.1.652 1.93 0 3.5-1.57 3.5-3.5 0-2.552-2.059-4.493-4.536-5.377Z" />
            </svg>
        );

        const IconDownload = () => (
            <svg fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5 mr-2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
        );

        // --- COMPOSANT PRINCIPAL ---
        function App() {
            const [activeTab, setActiveTab] = useState('activity'); // 'activity', 'correction', 'teacher'
            
            // Puzzle State (généré une seule fois)
            const puzzle = useMemo(() => generatePuzzle(), []);
            
            // Interactivité élève
            const [foundWords, setFoundWords] = useState([]);
            const [foundCells, setFoundCells] = useState(new Set());
            const [selectionLine, setSelectionLine] = useState([]);
            const [isSelecting, setIsSelecting] = useState(false);
            const [startCell, setStartCell] = useState(null);
            
            // État pour mémoriser toutes les lettres individuelles cliquées (bonnes ou fausses)
            const [clickedCells, setClickedCells] = useState(new Set());

            // Palette de couleurs pour le corrigé
            const COLORS = ['bg-pastel-blue', 'bg-pastel-pink', 'bg-pastel-yellow', 'bg-pastel-purple', 'bg-pastel-orange'];

            const getLine = (start, end) => {
                const dr = end.r - start.r;
                const dc = end.c - start.c;
                const steps = Math.max(Math.abs(dr), Math.abs(dc));
                if (steps === 0) return [`${start.r},${start.c}`];
                
                // Vérifier si c'est une ligne droite valide (horizontale, verticale, diagonale parfaite)
                if (Math.abs(dr) !== 0 && Math.abs(dc) !== 0 && Math.abs(dr) !== Math.abs(dc)) return [];
                
                const stepR = dr / steps;
                const stepC = dc / steps;
                let line = [];
                for(let i = 0; i <= steps; i++) {
                    line.push(`${start.r + stepR * i},${start.c + stepC * i}`);
                }
                return line;
            };

            const handlePointerDown = (r, c) => {
                if (activeTab !== 'activity') return;
                setIsSelecting(true);
                setStartCell({r, c});
                setSelectionLine([`${r},${c}`]);
            };

            const handlePointerEnter = (r, c) => {
                if (isSelecting && startCell) {
                    const line = getLine(startCell, {r, c});
                    setSelectionLine(line);
                }
            };

            const handlePointerUp = () => {
                if (!isSelecting) return;
                setIsSelecting(false);
                
                // Gérer le simple clic pour toutes les lettres (permet de cocher/décocher n'importe quelle case)
                if (selectionLine.length === 1) {
                    const clickedCoord = selectionLine[0];
                    
                    setClickedCells(prev => {
                        const newSet = new Set(prev);
                        // Si la lettre est déjà sélectionnée, on la retire. Sinon, on l'ajoute.
                        if (newSet.has(clickedCoord)) {
                            newSet.delete(clickedCoord);
                        } else {
                            newSet.add(clickedCoord);
                        }
                        return newSet;
                    });
                    
                    setSelectionLine([]);
                    setStartCell(null);
                    return;
                }
                
                // Vérifier si la sélection correspond à un mot
                const selectedStringForwards = selectionLine.map(coord => {
                    const [r, c] = coord.split(',').map(Number);
                    return puzzle.grid[r][c];
                }).join('');
                
                const selectedStringBackwards = selectedStringForwards.split('').reverse().join('');

                const matchedWordObj = puzzle.placedWords.find(w => 
                    (w.word === selectedStringForwards || w.word === selectedStringBackwards) &&
                    !foundWords.includes(w.word)
                );

                if (matchedWordObj) {
                    setFoundWords([...foundWords, matchedWordObj.word]);
                    setFoundCells(prev => new Set([...prev, ...matchedWordObj.cells]));
                }
                
                setSelectionLine([]);
                setStartCell(null);
            };

            // Fonction d'export PNG (html2canvas)
            const exportPNG = async () => {
                const element = document.getElementById('fiche-activite-container');
                if (!element) return;

                try {
                    const canvas = await html2canvas(element, {
                        scale: 2, // Haute résolution
                        useCORS: true,
                        backgroundColor: '#ffffff'
                    });
                    const dataURL = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = dataURL;
                    link.download = `Mot_Mystere_Activite.png`;
                    link.click();
                } catch (err) {
                    console.error("Erreur lors de la capture : ", err);
                }
            };

            const RenderSheet = ({ isCorrection }) => {
                return (
                    <div className="responsive-wrapper bg-gray-100">
                        <div id="fiche-activite-container" className="page-container flex flex-col p-6 border-4 border-brand-dark rounded-xl justify-between">
                            
                            {/* En-tête de la fiche */}
                            <div className="flex justify-between items-center border-b-2 border-brand/30 pb-3 mb-3">
                                <div className="flex items-center gap-3">
                                    <div className="bg-brand-light p-2.5 rounded-full border-2 border-brand">
                                        <IconPaw />
                                    </div>
                                    <div>
                                        <h1 className="font-title text-2xl text-brand-dark tracking-wide leading-none">Mot Mystère</h1>
                                        <h2 className="font-title text-lg text-brand-dark/70 uppercase leading-tight">Les Animaux</h2>
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1 font-handwriting text-base text-gray-700 w-56">
                                    <div className="flex items-end gap-2 border-b-2 border-dashed border-gray-400 pb-0.5">
                                        <span className="font-bold text-xs uppercase">Prénom:</span>
                                        <span className="flex-1"></span>
                                    </div>
                                    <div className="flex items-end gap-2 border-b-2 border-dashed border-gray-400 pb-0.5">
                                        <span className="font-bold text-xs uppercase">Date:</span>
                                        <span className="flex-1"></span>
                                    </div>
                                </div>
                            </div>

                            {/* Consignes */}
                            <div className="bg-brand-light/60 border border-brand/30 rounded-lg p-3 mb-3 text-gray-800 flex items-center gap-3 shadow-sm">
                                <div className="text-3xl">🔎</div>
                                <div className="text-sm leading-snug">
                                    <p className="font-bold text-brand-dark">Mission d'exploration :</p>
                                    <p className="font-body text-gray-700">
                                        1. Glisse la souris/doigt pour entourer les <strong className="text-brand-dark font-semibold">20 mots</strong> de la liste.<br/>
                                        2. Clique sur les <strong className="text-emerald-700 font-semibold">25 lettres restantes</strong> pour révéler le message secret en vert en bas !
                                    </p>
                                </div>
                            </div>

                            {/* Zone principale : Grille + Liste */}
                            <div className="flex flex-1 gap-4 mb-3 items-stretch min-h-0">
                                {/* Grille */}
                                <div 
                                    className="grid-container flex-1 bg-white border-3 border-brand-dark rounded-lg p-2 shadow-sm flex flex-col justify-center"
                                    onPointerLeave={handlePointerUp}
                                >
                                    <div 
                                        className="grid gap-1 h-full w-full"
                                        style={{ gridTemplateColumns: `repeat(${GRID_SIZE}, minmax(0, 1fr))` }}
                                    >
                                        {puzzle.grid.map((row, r) => row.map((letter, c) => {
                                            const cellCoord = `${r},${c}`;
                                            
                                            // Logique d'affichage selon le mode
                                            let isFound = isCorrection ? true : foundCells.has(cellCoord);
                                            let isSelected = !isCorrection && selectionLine.includes(cellCoord);
                                            let isSecretLetter = isCorrection && puzzle.secretMessageCells.includes(cellCoord);
                                            
                                            // Déterminer la couleur de correction / interaction
                                            let bgColor = 'bg-transparent';
                                            let textColor = 'text-gray-900';
                                            let fontWeight = 'font-bold';
                                            let extraClasses = '';

                                            if (isCorrection) {
                                                if (isSecretLetter) {
                                                    bgColor = 'bg-emerald-100 ring-2 ring-emerald-400 shadow-sm';
                                                    textColor = 'text-emerald-700';
                                                } else {
                                                    const wordIndex = puzzle.placedWords.findIndex(w => w.cells.includes(cellCoord));
                                                    if (wordIndex !== -1) {
                                                        bgColor = COLORS[wordIndex % COLORS.length];
                                                        textColor = 'text-gray-800';
                                                    } else {
                                                        textColor = 'text-gray-300';
                                                    }
                                                }
                                            } else {
                                                // Mode Activité
                                                if (isSelected) bgColor = 'bg-brand/30 rounded-md';
                                                else if (isFound) bgColor = 'bg-brand/20 rounded-md ring-2 ring-brand/50';
                                                
                                                // Colorer en VERT la lettre si cliquée (qu'elle soit bonne ou fausse)
                                                if (clickedCells.has(cellCoord)) {
                                                    textColor = 'text-emerald-700';
                                                    bgColor = 'bg-emerald-100';
                                                    fontWeight = 'font-extrabold';
                                                    extraClasses = 'ring-2 ring-emerald-400 scale-95 shadow-inner';
                                                }
                                            }

                                            return (
                                                <div 
                                                    key={cellCoord}
                                                    className={`
                                                        flex items-center justify-center 
                                                        font-mono text-xl cursor-pointer select-none transition-all duration-150 rounded-sm
                                                        ${bgColor} ${textColor} ${fontWeight} ${extraClasses}
                                                    `}
                                                    onPointerDown={() => handlePointerDown(r, c)}
                                                    onPointerEnter={() => handlePointerEnter(r, c)}
                                                    onPointerUp={handlePointerUp}
                                                >
                                                    {letter}
                                                </div>
                                            );
                                        }))}
                                    </div>
                                </div>

                                {/* Liste des mots - 2 colonnes compactes pour économiser l'espace */}
                                <div className="w-72 bg-gray-50 rounded-lg border-2 border-gray-200 p-4 flex flex-col">
                                    <h3 className="font-title text-center text-lg text-gray-700 mb-3 border-b-2 pb-2">Mots à trouver (20)</h3>
                                    <ul className="grid grid-cols-2 gap-x-3 gap-y-3 font-body text-sm font-semibold text-gray-700 flex-1 content-start">
                                        {VOCABULARY.map(word => {
                                            const isWordFound = isCorrection || foundWords.includes(word);
                                            return (
                                                <li key={word} className={`flex items-center gap-2 transition-all ${isWordFound ? 'word-strike' : ''}`}>
                                                    <div className={`w-4 h-4 border-2 rounded flex items-center justify-center flex-shrink-0 transition-colors ${isWordFound ? 'border-brand bg-brand' : 'border-gray-400 bg-white'}`}>
                                                        {isWordFound && (
                                                            <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={4}>
                                                                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                                            </svg>
                                                        )}
                                                    </div>
                                                    <span className="truncate">{word}</span>
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </div>
                            </div>

                            {/* Section Message Secret - Zone de dévoilement en Vert */}
                            <div className="bg-emerald-50/70 border-3 border-dashed border-emerald-500 p-3 rounded-xl text-center shadow-sm">
                                <div className="flex justify-center items-center gap-2 mb-2">
                                    <span className="text-xl">✨</span>
                                    <h3 className="font-title text-lg text-emerald-800 uppercase tracking-wide">Le Message Secret</h3>
                                    <span className="text-xl">✨</span>
                                </div>
                                <div className="flex flex-wrap justify-center gap-4 font-mono text-xl font-bold">
                                    {/* Affichage structuré du mot mystère */}
                                    {(() => {
                                        let charAbsIndex = 0;
                                        return SECRET_MESSAGE.split(' ').map((word, wIdx) => (
                                            <div key={wIdx} className="flex gap-1.5 bg-white/80 p-1.5 rounded-lg border border-emerald-200 shadow-sm">
                                                {word.split('').map((char, cIdx) => {
                                                    const currentAbsIndex = charAbsIndex++;
                                                    const targetCoord = puzzle.secretMessageCells[currentAbsIndex];
                                                    // Si isCorrection n'existe plus, on vérifie simplement les cellules cliquées
                                                    const isRevealed = clickedCells.has(targetCoord);
                                                    return (
                                                        <div 
                                                            key={cIdx} 
                                                            className={`w-7 h-9 border-b-3 border-emerald-600 flex items-center justify-center text-emerald-600 text-2xl font-black transition-all duration-300 ${isRevealed ? 'bg-emerald-100 rounded-t' : ''}`}
                                                        >
                                                            {isRevealed ? char : ''}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ));
                                    })()}
                                </div>
                            </div>

                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col font-body bg-gray-200">
                    
                    {/* UI Navigation (Sera ignorée par html2canvas) */}
                    <nav className="bg-white shadow-md p-4 sticky top-0 z-50" data-html2canvas-ignore="true">
                        <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex bg-gray-100 p-1 rounded-lg">
                                <button 
                                    onClick={() => setActiveTab('activity')}
                                    className={`px-6 py-2 rounded-md font-semibold transition-all ${activeTab === 'activity' ? 'bg-brand text-white shadow-sm' : 'text-gray-600 hover:bg-gray-200'}`}
                                >
                                    Matériel Élève
                                </button>
                                <button 
                                    onClick={() => setActiveTab('teacher')}
                                    className={`px-6 py-2 rounded-md font-semibold transition-all ${activeTab === 'teacher' ? 'bg-brand text-white shadow-sm' : 'text-gray-600 hover:bg-gray-200'}`}
                                >
                                    Fiche Enseignant
                                </button>
                            </div>
                            
                            {activeTab === 'activity' && (
                                <button 
                                    onClick={exportPNG}
                                    className="flex items-center bg-gray-800 hover:bg-black text-white px-5 py-2 rounded-lg font-bold transition-colors shadow-lg"
                                >
                                    <IconDownload />
                                    Télécharger en PNG
                                </button>
                            )}
                        </div>
                    </nav>

                    {/* Contenu de l'onglet actif */}
                    <main className="flex-1 flex flex-col overflow-hidden">
                        
                        {activeTab === 'activity' && <RenderSheet isCorrection={false} />}
                        
                        {activeTab === 'teacher' && (
                            <div className="max-w-4xl mx-auto p-8 w-full">
                                <div className="bg-white rounded-xl shadow-xl overflow-hidden">
                                    <div className="bg-brand-dark p-6 text-white text-center">
                                        <h2 className="font-title text-3xl mb-2">Fiche Pédagogique Enseignant</h2>
                                        <p className="opacity-90 font-medium">Activité : Mot Mystère - Thème Les Animaux</p>
                                    </div>
                                    <div className="p-8 space-y-8">
                                        <section>
                                            <h3 className="text-xl font-bold border-b-2 border-brand pb-2 mb-4">🎯 Objectifs visés</h3>
                                            <ul className="list-disc pl-6 space-y-2 text-gray-700">
                                                <li><strong>Orthographe lexicale :</strong> Consolidation des mots se terminant par une consonne muette (D, T).</li>
                                                <li><strong>Vocabulaire :</strong> Révision du lexique animalier courant.</li>
                                                <li><strong>Fonctions exécutives :</strong> Attention soutenue, repérage spatial, balayage visuel, et déduction.</li>
                                            </ul>
                                        </section>
                                        
                                        <section>
                                            <h3 className="text-xl font-bold border-b-2 border-brand pb-2 mb-4">📚 Liste des mots travaillés (20)</h3>
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-lg">
                                                {VOCABULARY.map(w => <div key={w} className="font-medium text-gray-800">{w}</div>)}
                                            </div>
                                            <p className="mt-3 text-sm text-gray-500 italic">Astuce d'animation : Demander aux élèves de trouver le féminin des mots de la liste pour entendre la consonne muette (ex: grand/grande, plat/plate, renard/renarde...).</p>
                                        </section>

                                        <section className="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg">
                                            <h3 className="text-lg font-bold text-yellow-800 mb-2">🔑 Révélation du Message Secret</h3>
                                            <p className="text-gray-800 mb-2">La mécanique "lettres restantes" forme la phrase suivante de 25 caractères :</p>
                                            <div className="text-2xl font-mono font-bold text-red-600 tracking-wider">
                                                {SECRET_MESSAGE}
                                            </div>
                                            <p className="mt-2 text-sm text-yellow-700">Les autres lettres non utilisées par les mots forment un texte de remplissage sans impact sur le jeu.</p>
                                        </section>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                    </main>
                </div>
            );
        }

        // Rendu de l'application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
