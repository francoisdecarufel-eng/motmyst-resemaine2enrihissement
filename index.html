<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur - Mot Mystère Rentrée</title>
    
    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (versions de production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel pour compiler le JSX directement dans le navigateur -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- html2canvas pour la capture d'image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURATION PÉDAGOGIQUE ET ÉDITORIALE ---
        const NIVEAU = "4e année";
        const THEME = "La Rentrée Scolaire";
        const TEMPS_ESTIME = "15 min";
        const MOTS_A_TROUVER = [
          "CARTABLE", "CRAYON", "GOMME", "CAHIER", "TABLEAU", 
          "CLOCHE", "PROFESSEUR", "RECREATION", "DEVOIRS", "TROUSSE", 
          "REGLE", "LECTURE", "ECOLE", "CALCUL", "CLASSE", 
          "PUPITRE", "ELEVE", "STYLO", "LIVRE", "CISEAUX"
        ];

        /* Générateur dynamique de phrase parfaite selon les cases restantes */
        const buildExactPhrase = (targetLen) => {
          const parts = [
            ["BRAVO", "SUPER", "GENIAL"],
            ["TU AS TROUVE", "TU AS DECOUVERT", "TU AS REUSSI A TROUVER"],
            ["TOUS LES MOTS", "LES MOTS"],
            ["CACHES", "SECRETS", ""],
            ["DANS LA GRILLE", "DE CETTE GRILLE", ""],
            ["NOUS TE SOUHAITONS", "ON TE SOUHAITE", "PASSE"],
            ["UNE BONNE", "UNE TRES BONNE", "UNE BELLE", "UNE EXCELLENTE", "UNE SUPERBE"],
            ["RENTREE", "RENTREE SCOLAIRE", "ANNEE", "ANNEE SCOLAIRE"]
          ];
          
          let foundPhrase = null;
          // Mélanger pour obtenir des phrases variées à chaque génération
          const shuffledParts = parts.map(arr => [...arr].sort(() => Math.random() - 0.5));

          const dfs = (partIndex, currentPhrase, currentLen) => {
            if (foundPhrase) return;
            if (partIndex === shuffledParts.length) {
              if (currentLen === targetLen) {
                foundPhrase = currentPhrase.trim().replace(/\s+/g, ' ');
              }
              return;
            }
            for (let word of shuffledParts[partIndex]) {
              let wLen = word.replace(/ /g, '').length;
              dfs(partIndex + 1, currentPhrase + (word ? " " + word : ""), currentLen + wLen);
            }
          };
          
          dfs(0, "", 0);
          return foundPhrase;
        };

        const TAILLE_GRILLE = 14;

        // Directions pour placer les mots (Horizontale, Verticale, Diagonales)
        const DIRECTIONS = [
          [0, 1],   // Droite
          [1, 0],   // Bas
          [1, 1],   // Diagonale Bas-Droite
          [-1, 1],  // Diagonale Haut-Droite
          [0, -1],  // Gauche (Inversé)
          [-1, 0],  // Haut (Inversé)
        ];

        // --- ALGORITHME DE GÉNÉRATION DE LA GRILLE ---
        const genererGrille = () => {
          let grille = [];
          let motsPlaces = [];
          let tentatives = 0;
          let succes = false;
          let phraseSecreteExacte = "";

          // Trier les mots par longueur (les plus longs en premier pour optimiser le placement)
          const motsTries = [...MOTS_A_TROUVER].sort((a, b) => b.length - a.length);

          while (!succes && tentatives < 500) {
            grille = Array(TAILLE_GRILLE).fill(null).map(() => Array(TAILLE_GRILLE).fill(''));
            motsPlaces = [];
            succes = true;

            for (const mot of motsTries) {
              let motPlace = false;
              for (let i = 0; i < 200; i++) {
                const dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
                const row = Math.floor(Math.random() * TAILLE_GRILLE);
                const col = Math.floor(Math.random() * TAILLE_GRILLE);

                if (peutPlacerMot(grille, mot, row, col, dir)) {
                  placerMot(grille, mot, row, col, dir, motsPlaces);
                  motPlace = true;
                  break;
                }
              }
              if (!motPlace) {
                succes = false;
                break; // Échec de placement, on recommence
              }
            }

            if (succes) {
              // Calcul du nombre de cases vides restantes
              let casesVides = 0;
              for (let r = 0; r < TAILLE_GRILLE; r++) {
                for (let c = 0; c < TAILLE_GRILLE; c++) {
                  if (grille[r][c] === '') casesVides++;
                }
              }
              
              // L'algorithme cherche une combinaison parfaite de mots pour combler EXACTEMENT ce trou
              phraseSecreteExacte = buildExactPhrase(casesVides);
              
              if (!phraseSecreteExacte) {
                succes = false; // Aucune phrase parfaite trouvée pour ce nombre de cases, on regénère une grille
              }
            }
            tentatives++;
          }

          // Remplissage des cases restantes avec la phrase mystère EXACTE trouvée
          const phraseSecreteSansEspaces = phraseSecreteExacte.replace(/ /g, '');

          let indexPhrase = 0;
          for (let r = 0; r < TAILLE_GRILLE; r++) {
            for (let c = 0; c < TAILLE_GRILLE; c++) {
              if (grille[r][c] === '') {
                grille[r][c] = { lettre: phraseSecreteSansEspaces[indexPhrase], type: 'mystere' };
                indexPhrase++;
              }
            }
          }

          return { grille, motsPlaces, phraseSecreteExacte };
        };

        const peutPlacerMot = (grille, mot, row, col, dir) => {
          const [dRow, dCol] = dir;
          for (let i = 0; i < mot.length; i++) {
            const r = row + i * dRow;
            const c = col + i * dCol;
            if (r < 0 || r >= TAILLE_GRILLE || c < 0 || c >= TAILLE_GRILLE) return false;
            if (grille[r][c] !== '' && grille[r][c].lettre !== mot[i]) return false;
          }
          return true;
        };

        const placerMot = (grille, mot, row, col, dir, motsPlaces) => {
          const [dRow, dCol] = dir;
          const cases = [];
          for (let i = 0; i < mot.length; i++) {
            const r = row + i * dRow;
            const c = col + i * dCol;
            grille[r][c] = { lettre: mot[i], type: 'mot' };
            cases.push(`${r}-${c}`);
          }
          motsPlaces.push({ mot, cases });
        };

        // --- COMPOSANT PRINCIPAL ---
        function App() {
          const [ongletActif, setOngletActif] = useState(1);
          const [donneesJeu, setDonneesJeu] = useState(null);
          
          useEffect(() => {
            // Génération initiale
            setDonneesJeu(genererGrille());
          }, []);

          const exporterPNG = async (elementId, nomFichier) => {
            if (!window.html2canvas) {
              alert("La librairie de capture n'est pas encore chargée.");
              return;
            }
            const element = document.getElementById(elementId);
            if (element) {
              const canvas = await window.html2canvas(element, {
                scale: 2, // Haute définition
                useCORS: true,
                backgroundColor: '#ffffff'
              });
              const link = document.createElement('a');
              link.download = `${nomFichier}.png`;
              link.href = canvas.toDataURL('image/png');
              link.click();
            }
          };

          if (!donneesJeu) return <div className="p-10 text-center font-bold text-xl">Génération de l'activité en cours...</div>;

          const { grille, motsPlaces, phraseSecreteExacte } = donneesJeu;

          // Regrouper les mots en 2 colonnes pour l'affichage
          const motsTriesAlphabetique = [...MOTS_A_TROUVER].sort();
          const demi = Math.ceil(motsTriesAlphabetique.length / 2);
          const colonne1 = motsTriesAlphabetique.slice(0, demi);
          const colonne2 = motsTriesAlphabetique.slice(demi);

          // Style CSS embarqué pour garantir l'impression et les contraintes
          const stylesImpression = `
            @media print {
              body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: white; }
              .no-print { display: none !important; }
              .page-container { border: none !important; margin: 0 !important; box-shadow: none !important; }
            }
            .page-container {
              width: 850px;
              height: 1100px; /* Format Lettre US strict */
              margin: 0 auto;
              background: white;
              color: black;
              position: relative;
              overflow: hidden;
              box-sizing: border-box;
              font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            }
            .grid-cell {
              width: 33px;
              height: 33px;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 17px;
              font-weight: bold;
              text-transform: uppercase;
              border: 1px solid #d1d5db; /* gray-300 */
            }
            .corrige-mot {
              background-color: #e5e7eb; /* gray-200 */
              color: #374151; /* gray-700 */
            }
            .corrige-mystere {
              font-weight: 900;
              color: #000;
              border: 2px solid #000;
            }
          `;

          return (
            <div className="min-h-screen bg-gray-100 p-4 font-sans flex flex-col items-center">
              <style>{stylesImpression}</style>

              {/* --- MENU DES ONGLETS (Non imprimé, non capturé) --- */}
              <div className="no-print bg-white p-4 rounded-xl shadow-md flex gap-4 mb-6" data-html2canvas-ignore="true">
                <button 
                  onClick={() => setOngletActif(1)} 
                  className={`px-6 py-2 rounded-lg font-bold border-2 transition-colors ${ongletActif === 1 ? 'bg-black text-white border-black' : 'bg-white text-black border-gray-300 hover:border-black'}`}
                >
                  📄 Fiche Élève
                </button>
                <button 
                  onClick={() => setOngletActif(2)} 
                  className={`px-6 py-2 rounded-lg font-bold border-2 transition-colors ${ongletActif === 2 ? 'bg-black text-white border-black' : 'bg-white text-black border-gray-300 hover:border-black'}`}
                >
                  ✅ Corrigé
                </button>
                <button 
                  onClick={() => setOngletActif(3)} 
                  className={`px-6 py-2 rounded-lg font-bold border-2 transition-colors ${ongletActif === 3 ? 'bg-black text-white border-black' : 'bg-white text-black border-gray-300 hover:border-black'}`}
                >
                  🎓 Fiche Enseignant
                </button>
              </div>

              {/* --- ONGLET 1 : FICHE ACTIVITÉ --- */}
              <div className={`${ongletActif === 1 ? 'block' : 'hidden'} flex flex-col items-center w-full`}>
                
                <button 
                  data-html2canvas-ignore="true"
                  onClick={() => exporterPNG('fiche-eleve', 'MotMystere_Rentree_Eleve')}
                  className="no-print mb-4 px-6 py-3 bg-blue-600 text-white font-bold rounded shadow hover:bg-blue-700 transition flex items-center gap-2"
                >
                  <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                  Télécharger l'Activité (PNG)
                </button>

                <div id="fiche-eleve" className="page-container border border-gray-300 shadow-xl p-5 flex flex-col">
                  
                  {/* EN-TÊTE ÉLÈVE */}
                  <div className="flex justify-between items-end border-b-2 border-black pb-3 mb-4">
                    <div className="flex flex-col gap-2 w-1/2">
                      <div className="flex items-center gap-2 text-lg">
                        <span className="font-bold">Prénom :</span>
                        <div className="flex-1 border-b border-black"></div>
                      </div>
                      <div className="flex items-center gap-2 text-lg">
                        <span className="font-bold">Date :</span>
                        <div className="flex-1 border-b border-black"></div>
                      </div>
                    </div>
                    <div className="text-right">
                      <span className="inline-block border-2 border-black rounded-full px-4 py-1 text-sm font-bold uppercase tracking-wider mb-2">Niveau : {NIVEAU}</span>
                      <div className="text-sm font-bold flex items-center justify-end gap-1">
                        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
                        Temps : {TEMPS_ESTIME}
                      </div>
                    </div>
                  </div>

                  {/* TITRE DE L'ACTIVITÉ */}
                  <div className="text-center mb-4">
                    <h1 className="text-4xl font-black uppercase tracking-widest mb-2 border-black inline-block border-4 px-6 py-1 bg-gray-50">Mot Mystère</h1>
                    <h2 className="text-xl font-bold italic text-gray-700">Thème : {THEME}</h2>
                  </div>

                  {/* CONSIGNES */}
                  <div className="bg-gray-100 border-2 border-dashed border-gray-400 p-3 rounded-lg mb-4 text-base font-medium">
                    <strong>Consigne :</strong> Trouve et encercle les {MOTS_A_TROUVER.length} mots cachés dans la grille. Ils peuvent être à l'endroit, à l'envers, à la verticale, à l'horizontale ou en diagonale.
                    <br/>
                    <strong>Le Message Secret :</strong> Une fois tous les mots trouvés, lis les lettres restantes de gauche à droite et de haut en bas pour découvrir la phrase mystère de la rentrée !
                  </div>

                  {/* ZONE CENTRALE : GRILLE + MOTS */}
                  <div className="flex gap-6 w-full flex-1">
                    
                    {/* GRILLE */}
                    <div className="flex-none">
                      <div className="border-4 border-black inline-block p-1 bg-white">
                        <div style={{ display: 'grid', gridTemplateColumns: `repeat(${TAILLE_GRILLE}, 1fr)`, gap: '0' }}>
                          {grille.map((row, r) => row.map((cell, c) => (
                            <div key={`${r}-${c}`} className="grid-cell bg-white text-black">
                              {cell.lettre}
                            </div>
                          )))}
                        </div>
                      </div>
                    </div>

                    {/* BANQUE DE MOTS */}
                    <div className="flex-1 flex flex-col min-w-0">
                      <h3 className="text-lg font-bold mb-3 uppercase border-b-2 border-black inline-block w-full">Mots à trouver ({MOTS_A_TROUVER.length})</h3>
                      <div className="flex gap-2 w-full">
                        <div className="flex-1 flex flex-col gap-2">
                          {colonne1.map((mot, i) => (
                            <div key={i} className="flex items-center gap-2 text-[15px] font-bold">
                              <div className="w-4 h-4 border-2 border-black rounded-sm flex-none"></div>
                              <span className="break-words">{mot}</span>
                            </div>
                          ))}
                        </div>
                        <div className="flex-1 flex flex-col gap-2">
                          {colonne2.map((mot, i) => (
                            <div key={i} className="flex items-center gap-2 text-[15px] font-bold">
                              <div className="w-4 h-4 border-2 border-black rounded-sm flex-none"></div>
                              <span className="break-words">{mot}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                  </div>

                  {/* ZONE MESSAGE SECRET */}
                  <div className="mt-auto mb-2 border-t-2 border-black pt-4">
                    <h3 className="text-lg font-bold uppercase mb-3 text-center">Écris le message secret ici :</h3>
                    <div className="flex flex-wrap justify-center gap-x-5 gap-y-3 px-2">
                      {phraseSecreteExacte.split(' ').map((mot, mIdx) => (
                        <div key={mIdx} className="flex gap-[2px]">
                          {mot.split('').map((char, cIdx) => (
                            <div key={cIdx} className="w-6 h-8 border-b-2 border-black flex items-end justify-center pb-1 text-base font-bold text-transparent">
                              {/* Transparent so the student can write */}
                              {char}
                            </div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                  
                </div>
              </div>

              {/* --- ONGLET 2 : CORRIGÉ --- */}
              <div className={`${ongletActif === 2 ? 'block' : 'hidden'} flex flex-col items-center w-full`}>
                
                <button 
                  data-html2canvas-ignore="true"
                  onClick={() => exporterPNG('fiche-corrige', 'MotMystere_Rentree_Corrige')}
                  className="no-print mb-4 px-6 py-3 bg-green-600 text-white font-bold rounded shadow hover:bg-green-700 transition flex items-center gap-2"
                >
                  <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                  Télécharger le Corrigé (PNG)
                </button>

                <div id="fiche-corrige" className="page-container border border-gray-300 shadow-xl p-5 flex flex-col">
                  
                  {/* EN-TÊTE CORRIGÉ */}
                  <div className="flex justify-between items-center border-b-2 border-black pb-3 mb-4 bg-black text-white p-3 rounded">
                    <h1 className="text-2xl font-black uppercase tracking-widest">CORRIGÉ DE L'ENSEIGNANT</h1>
                    <span className="font-bold text-base">{THEME}</span>
                  </div>

                  <div className="text-center mb-5">
                    <h2 className="text-3xl font-black uppercase tracking-widest border-black inline-block border-4 px-6 py-1 bg-gray-50">Mot Mystère</h2>
                  </div>

                  <div className="flex gap-6 w-full flex-1">
                    
                    {/* GRILLE CORRIGÉE */}
                    <div className="flex-none">
                      <div className="border-4 border-black inline-block p-1 bg-white">
                        <div style={{ display: 'grid', gridTemplateColumns: `repeat(${TAILLE_GRILLE}, 1fr)`, gap: '0' }}>
                          {grille.map((row, r) => row.map((cell, c) => (
                            <div key={`${r}-${c}`} className={`grid-cell ${cell.type === 'mot' ? 'corrige-mot' : 'corrige-mystere'}`}>
                              {cell.lettre}
                            </div>
                          )))}
                        </div>
                      </div>
                    </div>

                    {/* BANQUE DE MOTS CORRIGÉE */}
                    <div className="flex-1 flex flex-col min-w-0">
                      <h3 className="text-lg font-bold mb-3 uppercase border-b-2 border-black inline-block w-full">Mots validés ({MOTS_A_TROUVER.length})</h3>
                      <div className="flex gap-2 w-full">
                        <div className="flex-1 flex flex-col gap-2">
                          {colonne1.map((mot, i) => (
                            <div key={i} className="flex items-center gap-2 text-[15px] font-bold text-gray-500 line-through">
                              <div className="w-4 h-4 border-2 border-black rounded-sm flex-none bg-black flex items-center justify-center text-white" style={{ fontSize: '10px' }}>✓</div>
                              <span className="break-words">{mot}</span>
                            </div>
                          ))}
                        </div>
                        <div className="flex-1 flex flex-col gap-2">
                          {colonne2.map((mot, i) => (
                            <div key={i} className="flex items-center gap-2 text-[15px] font-bold text-gray-500 line-through">
                              <div className="w-4 h-4 border-2 border-black rounded-sm flex-none bg-black flex items-center justify-center text-white" style={{ fontSize: '10px' }}>✓</div>
                              <span className="break-words">{mot}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                  </div>

                  {/* ZONE MESSAGE SECRET CORRIGÉ */}
                  <div className="mt-auto mb-2 border-t-2 border-black pt-4">
                    <h3 className="text-lg font-bold uppercase mb-3 text-center">Solution du message secret :</h3>
                    <div className="flex flex-wrap justify-center gap-x-5 gap-y-3 px-2">
                      {phraseSecreteExacte.split(' ').map((mot, mIdx) => (
                        <div key={mIdx} className="flex gap-[2px]">
                          {mot.split('').map((char, cIdx) => (
                            <div key={cIdx} className="w-6 h-8 border-b-2 border-black flex items-end justify-center pb-1 text-lg font-black text-black bg-gray-200 rounded-t-sm">
                              {char}
                            </div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                  
                </div>
              </div>

              {/* --- ONGLET 3 : FICHE ENSEIGNANT --- */}
              <div className={`${ongletActif === 3 ? 'block' : 'hidden'} w-full max-w-4xl`}>
                <div className="bg-white p-10 rounded-xl shadow-xl border border-gray-300">
                  <h1 className="text-3xl font-black mb-6 uppercase border-b-4 border-black pb-2">Notes Pédagogiques</h1>
                  
                  <div className="grid grid-cols-2 gap-8 mb-8">
                    <div className="bg-gray-50 p-6 rounded-lg border border-gray-200">
                      <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                        <span className="text-2xl">🎯</span> Objectifs Visés
                      </h2>
                      <ul className="list-disc pl-5 space-y-2 text-lg">
                        <li>Enrichissement du vocabulaire thématique (Rentrée).</li>
                        <li>Développement de l'attention visuelle et de la concentration.</li>
                        <li>Repérage spatial complexe (lecture multidirectionnelle).</li>
                        <li>Résolution de problèmes avec méthode de déduction (lettres restantes).</li>
                      </ul>
                    </div>
                    
                    <div className="bg-gray-50 p-6 rounded-lg border border-gray-200">
                      <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                        <span className="text-2xl">⚙️</span> Mécanique du jeu
                      </h2>
                      <p className="text-lg leading-relaxed">
                        Activité auto-corrective par la phrase mystère. L'élève doit encercler les {MOTS_A_TROUVER.length} mots dans la grille. Les lettres qui <strong>ne sont pas</strong> utilisées par les mots forment, lues de gauche à droite et de haut en bas, une phrase complète. Si la phrase n'a pas de sens, l'élève sait qu'il a fait une erreur ou oublié un mot.
                      </p>
                    </div>
                  </div>

                  <div className="bg-black text-white p-6 rounded-lg shadow-inner">
                    <h2 className="text-xl font-bold mb-2 uppercase tracking-wide text-gray-300">La Phrase Mystère Révélée :</h2>
                    <p className="text-2xl font-black leading-snug">{phraseSecreteExacte}</p>
                  </div>
                  
                  <div className="mt-8 text-center text-gray-500 italic">
                    Document généré automatiquement. Prêt pour l'impression format Lettre US.
                  </div>
                </div>
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
